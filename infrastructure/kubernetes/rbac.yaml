apiVersion: v1
kind: Namespace
metadata:
  name: secureops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureops-api
  namespace: secureops
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_IRSA_ROLE_ARN
---
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: secureops-runtime-reader
  namespace: secureops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secureops-runtime-reader
  namespace: secureops
subjects:
  - kind: ServiceAccount
    name: secureops-api
    namespace: secureops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secureops-runtime-reader
