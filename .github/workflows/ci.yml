name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            requirements-api.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m compileall apps src workers scripts
      - run: pytest -q
      - run: python evals/run_security_eval.py
        env:
          PYTHONPATH: .

  node-gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/event-gateway
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/event-gateway/package-lock.json
      - run: npm ci
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check
      - run: terraform init -backend=false
      - run: terraform validate
