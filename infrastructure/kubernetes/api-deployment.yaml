apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureops-api
  template:
    metadata:
      labels:
        app: secureops-api
    spec:
      containers:
        - name: api
          image: YOUR_ECR_REPO/secureops-api:latest
          ports:
            - containerPort: 8200
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 5
            periodSeconds: 10
