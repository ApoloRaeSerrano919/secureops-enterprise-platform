apiVersion: v1
kind: Namespace
metadata:
  name: secureops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureops-api
  namespace: secureops
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_IRSA_ROLE_ARN
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secureops-runtime-reader
  namespace: secureops
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
---
